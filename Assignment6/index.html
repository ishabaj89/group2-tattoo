<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Ramaraja&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style/normalize.css">
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <header>
        <div class="headFlex">
            <nav>
                <ul>
                    <li><a>HOME</a></li>
                    <li><a>ABOUT</a></li>
                    <li><a>GALLERY</a></li>
                    <li><a>CONTACT</a></li>
                </ul>
            </nav>
            <button class="headButton">BOOK A SESSION</button>
        </div>
    </header>
    
    <h1>LET'S MAKE IT PERMANENT</h1>
    <p class="subheader">Tell us a little about your idea and we'll take it from there.</p>
    <form>
        <div><label class="name" id="name" for="nameInput" >NAME </label></div>

        <input id="nameInput" type="text" placeholder="Your full name">

        <div><label class="email" for="emailInput" >EMAIL </label> </div>
        <input id="emailInput" type="email" placeholder="your@example.com" required minlength="1">

        <div><label class="message" for="messageInput" >MESSAGE </label></div>
        <input id="messageInput" type="text" placeholder="Tell us about your idea">
        
        <div>
            <button class="inqButton" type="submit">Send Inquiry</button>
        </div>
        
    </form>
    
        
    
    
 
</body>
</html>
